<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast">世界状态已更新，正在重新计算候选方案…</div>
  <div class="prototype-bar" aria-label="原型方案切换">
    <button id="prev" aria-label="上一个方案">‹</button><span class="label" id="variant-label"></span><button id="next" aria-label="下一个方案">›</button>
    <span class="proto-hint">← / → 切换</span>
  </div>
  <script>
    // Prototype question: Which information hierarchy best supports evidence-based disaster command across desktop and mobile?
    const variants=[{key:'A',name:'态势指挥中心'},{key:'B',name:'证据优先工作台'},{key:'C',name:'现场移动任务流'}];
    let variant=new URLSearchParams(location.search).get('variant')||'A';
    let device=new URLSearchParams(location.search).get('device')||'desktop';
    let confirmed=false;
    const app=document.getElementById('app');
    const mapMarkup=()=>`<div class="map"><div class="zone"></div><div class="road r1"></div><div class="road r2 ${confirmed?'blocked':''}"></div><div class="marker a">A</div><div class="marker b">R1</div><div class="marker c">!</div><div class="map-legend"><span><b style="background:#ffbe55"></b>建筑</span><span><b style="background:#50d6d1"></b>资源</span><span><b style="background:#ff6b6b"></b>风险</span></div></div>`;
    const videoMarkup=()=>`<div class="video"><div class="video-tag"><span class="live"><i></i>分析证据</span> DJI_0421.MP4 · 00:21</div><div class="building"></div><div class="person"></div><div class="scan"><label>疑似被困 ×3 · 86%</label></div><div class="controls"><button class="play">▶</button><div class="track"><i></i></div><span class="time">00:21 / 01:12</span></div></div><div class="timeline"><button class="event active"><strong>00:21 · 人员</strong><small>二层疑似被困 3 人</small></button><button class="event"><strong>00:42 · 建筑</strong><small>局部损坏线索</small></button><button class="event"><strong>00:58 · 道路</strong><small>East Route 可通行</small></button></div>`;
    const planMarkup=(compact=false)=>`<div class="replan ${confirmed?'show':''}">⚠ East Route 已被人工确认阻断，Plan A 已标记为过期。<button class="ghost" style="float:right;padding:3px 7px;font-size:11px" onclick="replan()">重新规划</button></div><div class="plan-tabs"><button class="active">Plan A · 最快抵达</button><button>Plan B · 低风险</button></div><div class="plan-card"><div class="row"><h4>先侦察，再进入</h4><span class="badge green">可执行</span></div><p>目标：Building A · 3 名疑似被困人员</p>${compact?'':`<div class="step"><div class="num">1</div><div><strong>Drone 1 · 现场复核</strong><small>确认楼梯与二次坍塌迹象 · 3 min</small></div></div><div class="step"><div class="num">2</div><div><strong>Rescue Team 1 · 结构搜救</strong><small>${confirmed?'改走 South Route · 9 min':'East Route · 6 min'}</small></div></div><div class="step"><div class="num">3</div><div><strong>Ambulance 1 · 待命接驳</strong><small>集合点：South Gate</small></div></div>`}<div class="action"><button class="primary" onclick="toast('已将方案加入待确认队列')">加入待确认</button><button class="ghost" onclick="toast('已展开方案依据')">查看依据</button></div></div>`;
    function chrome(inner,title='地震 · 北城片区') {return `<header class="topbar"><div class="brand"><div class="logo">⌁</div>AI Disaster Commander</div><div class="crumb">/ ${title}</div><div class="incident"><span class="live"><i></i>LIVE · 14:32</span><div class="avatar">指</div></div></header>${inner}`}
    function variantA(){return chrome(`<main class="shell"><div class="title-row"><div><div class="kicker">COMMAND CENTER · EARTHQUAKE</div><h1 class="title">北城片区 · 现场态势</h1><p class="subtitle">最后更新 14:32:08 · 世界状态 v17 · 3 个待确认观察</p></div><div class="view-switch"><button class="active" onclick="setDevice('desktop')">桌面</button><button onclick="setDevice('mobile')">移动预览</button></div></div><div class="stats" style="margin-bottom:16px"><div class="stat"><small>疑似被困</small><strong>03</strong></div><div class="stat"><small>高风险点</small><strong style="color:var(--red)">02</strong></div><div class="stat"><small>可用资源</small><strong style="color:var(--cyan)">04</strong></div><div class="stat"><small>信息缺口</small><strong style="color:var(--amber)">05</strong></div></div><div class="grid command-grid"><section class="panel"><div class="panel-head"><h3>现场视频 · 证据时间轴</h3><span>1 / 3 片段</span></div><div class="panel-body">${videoMarkup()}</div></section><section class="panel"><div class="panel-head"><h3>灾害地图 · 行动路线</h3><span>点击对象查看详情</span></div><div class="panel-body">${mapMarkup()}</div></section><section class="panel"><div class="panel-head"><h3>当前世界状态</h3><span>RDF · v17</span></div><div class="panel-body"><div class="list"><div class="item"><i class="dot"></i><p><b>3 名疑似被困人员</b><span>位于 Building A 二层 · 证据 00:21 · 未确认</span></p><span class="badge amber">待确认</span></div><div class="item"><i class="dot" style="background:var(--red)"></i><p><b>Building A 局部损坏</b><span>存在结构进入风险 · 证据 00:42</span></p><span class="badge red">高风险</span></div><div class="item"><i class="dot" style="background:var(--amber)"></i><p><b>${confirmed?'East Route 已阻断':'East Route 可通行'}</b><span>${confirmed?'人工确认 · 14:33':'来源：现场视频 · 00:58'}</span></p><button class="ghost" style="padding:4px 7px;font-size:11px" onclick="confirmRoad()">${confirmed?'已确认':'确认'}</button></div></div></div></section><section class="panel"><div class="panel-head"><h3>候选救援方案</h3><span>约束检查 · 0 违规</span></div><div class="panel-body">${planMarkup()}</div></section></div></main>`)}

  function reviewPage(){const o=observations[design.observation],s=design.review[design.observation];return `<main class="stage-shell">${pageHeader('04 / EVIDENCE REVIEW','先核验信息，再更新判断','当前世界状态 '+(design.status==='current'?'v17':'v18')+' · 每次确认、驳回与纠错均保留记录')}<div class="review-layout"><aside class="observation-list">${observations.map((v,i)=>`<button class="observation-choice ${i===design.observation?'active':''}" onclick="design.observation=${i};render()"><span class="kicker">${v.kind} / ${v.time}</span><strong>${v.title}</strong><span class="badge ${design.review[i]==='已驳回'?'red':design.review[i]==='待确认'?'amber':'green'}">${design.review[i]}</span></button>`).join('')}<div class="notice">已驳回的观察不参与当前方案解释。原始观察仍保留在审计记录中。</div></aside><section class="panel"><div class="panel-head"><h3>${o.kind}观察 · OBS-00${92+design.observation}</h3><span class="badge ${s==='待确认'?'amber':'green'}">${s}</span></div><div class="panel-body">${videoMarkup()}<div class="evidence-card" style="margin-top:16px"><div class="row"><h4>${o.title}</h4><span class="subtitle" style="font-size:11px">模型置信度 ${o.confidence}</span></div><p class="quote">${o.detail}</p><div class="notice">行动影响：${o.impact}</div><div class="action" style="flex-wrap:wrap"><button class="primary" onclick="decide('已确认')">确认此观察</button><button class="ghost" onclick="decide('已驳回')">驳回观察</button>${design.observation===2?'<button class="danger-button" onclick="openCorrection()">纠正为道路阻断</button>':''}</div></div><div class="source-line">来源 ${esc(design.source)} · ${o.time} · 示例模型 demo-v1 · 原始记录保留</div></div></section></div><div class="stage-footer"><span>${design.decisions.length} 条人工记录</span><button class="primary" onclick="go('plans')">查看方案影响 →</button></div></main>`;}
  function planPage(){const stale=['stale','calculating'].includes(design.status),updated=design.status==='ready';return `<main class="stage-shell">${pageHeader('05 / PLAN COMPARISON','每次调整，都能解释为什么',`候选方案 · 绑定世界状态 ${design.status==='current'?'v17':'v18'} · 人工确认前不进入任务清单`)}${stale?`<div class="execute-banner warning"><div><strong>${design.status==='calculating'?'正在重新检查路线与资源…':'现场已更新，原方案失效'}</strong><span>东侧道路已确认阻断，基于 v17 的方案不可继续采用。</span></div><button class="primary" onclick="replan()" ${design.status==='calculating'?'disabled':''}>${design.status==='calculating'?'正在重算':'生成新方案'}</button></div>`:updated?'<div class="execute-banner"><div><strong>新方案已生成 · 待人工确认</strong><span>排除东侧道路，改走南侧道路；示例抵达时间增加 3 分钟。</span></div><span class="badge green">v18</span></div>':''}<div class="stage-grid"><section class="panel"><div class="panel-head"><h3>${updated?'变更后的候选方案':'两种行动顺序'}</h3><span>${stale?'已过期':'待确认'}</span></div><div class="panel-body"><div class="compare">${['A','B'].map((key,i)=>`<button class="compare-card ${design.choice===key?'recommended':''}" style="text-align:left" onclick="design.choice='${key}';design.approved=false;render()"><div class="kicker">PLAN ${key} ${i?' / 信息优先':' / 抵达优先'}</div><h4 style="margin-top:8px">${i?'先补齐入口信息':'并行侦察与待命'}</h4><p class="subtitle">${updated?'南侧道路':'东侧道路'} · ${updated?'9':'6'} 分钟抵达集合点</p><ul><li>${i?'无人机复核后，队伍前往集合点':'无人机复核时，队伍前往安全集合点'}</li><li>进入建筑前需专业结构评估</li><li>${i?'更晚动用队伍，减少无效移动':'提前做好人员与医疗接驳准备'}</li></ul><span class="badge ${stale?'red':design.choice===key?'green':'blue'}" style="display:inline-block;margin-top:14px">${stale?'方案过期':design.choice===key?'当前选择':'选择此方案'}</span></button>`).join('')}</div><div class="evidence-card" style="margin-top:14px"><h4>约束与前置条件</h4><div class="item"><i class="dot"></i><p>队伍能力匹配：结构搜救<span>搜救一队，医疗转运由救护车支持。</span></p></div><div class="item"><i class="dot"></i><p>道路检查：${stale?'失败，原路线包含阻断路段':updated?'已排除东侧道路':'东侧道路仍需现场复核'}<span>北侧道路已阻断，不参与当前路径。</span></p></div><div class="item"><i class="dot" style="background:var(--amber)"></i><p>建筑进入：等待现场结构评估<span>路线可达不代表具备安全进入条件。</span></p></div></div></div></section><aside class="panel"><div class="panel-head"><h3>${updated?'为什么方案改变':'为什么这样安排'}</h3><span>证据与未知</span></div><div class="panel-body"><div class="reason-chain"><div><span class="badge blue">观察</span><p>${design.review[0]==='已驳回'?'人员观察已驳回，当前人员数量未知，保留现场侦察任务。':'A 栋二层有 3 名疑似被困人员。'}</p><button class="text-button" onclick="design.observation=0;go('review')">回看证据 00:21 ↗</button></div><div><span class="badge amber">${updated?'人工修正':'推断'}</span><p>${updated?'东侧道路由“初始可通行”变为“确认阻断”。':'局部损坏线索与未知入口情况，使现场复核成为前置任务。'}</p></div><div><span class="badge green">${updated?'方案变化':'行动建议'}</span><p>${updated?'将东侧路线排除，使用南侧备选路线；队伍与医疗资源保持匹配。':'先核实入口与结构，再决定是否进入；救护车在安全区待命。'}</p></div></div><div class="notice">关键未知：楼梯是否完整、内部损坏程度、人员伤情。任一新信息均可能触发再次规划。</div><div class="action"><button class="ghost" onclick="openCorrection()">模拟道路变化</button></div></div></aside></div>${design.approved?'<div class="execute-banner" style="margin-top:16px"><div><strong>候选方案已加入本地任务清单</strong><span>仅模拟确认，不向任何设备或队伍发送指令。</span></div><button class="ghost" onclick="go(\'report\')">查看任务回报 →</button></div>':''}<div class="stage-footer"><span>示例时间用于比较方案，不表示真实现场评估。</span><button class="primary" onclick="approvePlan()" ${stale||design.approved?'disabled':''}>${design.approved?'已加入任务清单':'确认候选方案 '+design.choice}</button></div></main>`;}
  function reportPage(){return `<main class="stage-shell">${pageHeader('06 / FIELD REPORT','把现场变化，带回指挥中心','移动端优先的现场回报 · 演示任务 T-001')}<div class="stage-grid"><section class="panel"><div class="panel-head"><h3>入口与道路复核</h3><span class="badge ${design.reportSent?'green':'amber'}">${design.reportSent?'已提交回报':'待现场核实'}</span></div><div class="panel-body">${mapMarkup()}<div class="task-summary"><strong>复核 A 栋入口</strong><p class="subtitle">关注：道路障碍、楼梯状态、可见构件变化。</p></div><form onsubmit="submitReport(event)"><label class="form-label">东侧道路状态<select id="road-report"><option value="blocked">已阻断</option><option value="unknown">无法确认</option></select></label><label class="form-label">现场说明<textarea id="field-note" required maxlength="400" placeholder="描述障碍、位置和可见风险">东侧道路有大块构件散落，车辆无法通行；建议复核南侧道路。</textarea></label><button class="primary wide-button" type="submit">提交现场回报</button></form></div></section><aside class="panel"><div class="panel-head"><h3>回报如何影响指挥</h3><span>信息同步</span></div><div class="panel-body"><div class="step"><div class="num">1</div><div><strong>保存人工观察</strong><small>记录人员、说明与原始 AI 观察的差异。</small></div></div><div class="step"><div class="num">2</div><div><strong>标记关联方案过期</strong><small>使用旧道路状态的方案需要重新检查。</small></div></div><div class="step"><div class="num">3</div><div><strong>生成新的候选方案</strong><small>新路线再次等待指挥人员确认。</small></div></div>${design.reportSent?'<div class="notice" style="margin-top:18px">回报已保存到本次演示，前往方案页检查影响。</div><div class="action"><button class="primary" onclick="go(\'plans\')">查看方案影响 →</button></div>':''}<h4>本次人工记录</h4>${design.decisions.length?design.decisions.slice(-4).reverse().map(d=>`<div class="item"><i class="dot"></i><p>${esc(d.title)}<span>${esc(d.reason)}</span></p></div>`).join(''):'<p class="subtitle">暂无记录。</p>'}</div></aside></div></main>`;}
  render = function(){
    const stage=design.screen;
    if(stage==='home'){originalRender();}
    else {const pages={import:importPage,analysis:analysisPage,review:reviewPage,plans:planPage,report:reportPage};if(!pages[stage])design.screen='home';app.innerHTML=chrome((pages[stage]||importPage)());}
    const nav=document.createElement('div');nav.innerHTML=flowNav();const header=app.querySelector('.topbar');header?header.after(nav):app.prepend(nav);
    if(!document.getElementById('design-controls')){const controls=document.createElement('div');controls.id='design-controls';controls.className='design-controls';controls.innerHTML=`<span>原型预览</span><button onclick="setDevice('desktop')" class="${device==='desktop'?'selected':''}">网页</button><button onclick="setDevice('mobile')" class="${device==='mobile'?'selected':''}">手机</button><button onclick="resetDemo()">重置演示</button>`;app.prepend(controls);}else{document.querySelectorAll('#design-controls button').forEach((b,i)=>b.classList.toggle('selected',i===(device==='desktop'?0:1)));}
    document.body.classList.toggle('preview-phone',device==='mobile');
    const stale=['stale','calculating'].includes(design.status);
    app.querySelectorAll('.plan-card').forEach(card=>{const b=card.querySelector('.badge');if(b){b.textContent=stale?'方案过期':design.status==='ready'?'新方案待确认':'待人工确认';b.className='badge '+(stale?'red':'amber');}card.querySelectorAll('.action button').forEach((button,i)=>{button.disabled=stale;button.onclick=()=>i?go('plans'):approvePlan();});});
    app.querySelectorAll('.replan').forEach(el=>el.classList.toggle('show',stale));
    app.querySelectorAll('.plan-tabs button').forEach(button=>button.onclick=()=>go('plans'));
    app.querySelectorAll('.bottom-nav').forEach(el=>el.innerHTML=[['home','⌂','态势'],['review','◌','证据'],['plans','◎','方案'],['report','↥','回报']].map(([screen,icon,label])=>`<button class="${screen===stage?'active':''}" onclick="go('${screen}')">${icon}<b>${label}</b></button>`).join(''));
    app.querySelectorAll('.marker').forEach(el=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','查看现场对象证据');el.onclick=()=>go('review');el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go('review');};});
    app.querySelectorAll('.timeline .event').forEach((el,i)=>{el.classList.toggle('active',i===design.observation);el.onclick=()=>{design.observation=i;go('review');};});
    app.querySelectorAll('.video').forEach(el=>{const time=observations[design.observation].time.split('–')[0];el.querySelector('.time').textContent=time+' / 01:12';el.querySelector('.scan label').textContent=observations[design.observation].kind+' · 示意标注';el.querySelector('.video-tag').innerHTML='<span class="badge blue">关键帧示意</span> '+time+' · 非真实视频';el.querySelector('.play').onclick=()=>toast('当前是关键帧示意；在下方时间轴切换证据。');});
    app.querySelectorAll('.live').forEach(el=>el.innerHTML='<i></i>演示现场');
    app.querySelectorAll('.panel-head span').forEach(el=>{if(el.textContent.includes('0 违规'))el.textContent=stale?'现场更新 · 待重新检查':'示例约束报告';});
    const mobile=app.querySelector('.mobile-wrap');if(mobile&&stage==='home'){mobile.querySelectorAll('.field-actions button').forEach((b,i)=>{b.onclick=()=>go(i?'report':'plans');});mobile.querySelectorAll('.mobile-section .action button').forEach((b,i)=>b.onclick=()=>i?openCorrection():go('review'));}
    document.getElementById('variant-label').textContent=variant+' · '+variants.find(v=>v.key===variant).name;
    history.replaceState(null,'',`?variant=${variant}&device=${device}&screen=${design.screen}`);
  };
  function go(screen){design.screen=screen;render();window.scrollTo({top:0,behavior:'smooth'});}
  function selectVideo(file){if(!file)return;if(!/\.mp4$/i.test(file.name)){toast('请选择 MP4 视频');return;}design.source=file.name;const label=document.getElementById('source-label');if(label)label.textContent='已选择：'+file.name+' · 仅展示文件名，分析仍使用示例';}
  function useSample(){design.source='DJI_0421.MP4';render();toast('已载入演示素材信息');}
  let analysisTimer;
  function startAnalysis(){clearInterval(analysisTimer);design.analysis=0;design.analyzing=true;go('analysis');analysisTimer=setInterval(()=>{design.analysis++;if(design.analysis>=4){design.analysis=4;design.analyzing=false;clearInterval(analysisTimer);}if(design.screen==='analysis')render();},850);}
  function finishAnalysis(){clearInterval(analysisTimer);design.analysis=4;design.analyzing=false;render();}
  function decide(status){if(design.review[design.observation]===status){toast('此观察已记录为'+status);return;}design.review[design.observation]=status;design.decisions.push({title:observations[design.observation].title+' · '+status,reason:'演示指挥员 · 原始观察保留'});design.approved=false;design.status='stale';render();toast('审核结果已保存，候选方案需要重新检查');}
  function openCorrection(){document.getElementById('correction-dialog').showModal();}
  confirmRoad=function(){openCorrection();};
  function saveCorrection(event){event.preventDefault();const reason=document.getElementById('correction-reason').value.trim();if(!reason)return;confirmed=true;design.status='stale';design.approved=false;design.review[2]='已纠正';design.reason=reason;design.decisions.push({title:'东侧道路：人工确认阻断',reason});document.getElementById('correction-dialog').close();render();toast('世界状态已更新为 v18；旧方案已过期');}
  replan=function(){if(design.status==='calculating')return;design.status='calculating';render();setTimeout(()=>{design.status='ready';design.choice='B';render();toast('新候选方案已生成，等待人工确认');},900);};
  function approvePlan(){if(['stale','calculating'].includes(design.status)){toast('请先重新规划');return;}design.approved=true;render();toast('已加入本地演示任务清单');}
  function submitReport(event){event.preventDefault();const note=document.getElementById('field-note').value.trim();if(!note)return;design.reportSent=true;design.decisions.push({title:'现场回报 · '+(document.getElementById('road-report').value==='blocked'?'东侧道路阻断':'道路状态无法确认'),reason:note});if(document.getElementById('road-report').value==='blocked'){confirmed=true;design.review[2]='已纠正';}design.status='stale';design.approved=false;render();toast('回报已保存；相关方案需要重新检查');}
  function resetDemo(){clearInterval(analysisTimer);confirmed=false;Object.assign(design,{screen:'import',status:'current',choice:'A',approved:false,review:['待确认','待确认','待确认'],observation:0,source:'DJI_0421.MP4',analysis:0,analyzing:false,reason:'',decisions:[],reportSent:false});render();toast('演示已重置');}
</script>
<style>

mary{margin:20px 0}.task-summary strong{font-size:18px}.task-summary p{margin-top:7px}.bottom-nav button{background:none;color:#91a8bd;padding:9px;min-width:58px;min-height:44px}.bottom-nav button.active{color:var(--cyan)}button:disabled{opacity:.4;cursor:not-allowed}.panel,.stage-grid>*{min-width:0}.execute-banner span{font-size:12px}.prototype-bar{bottom:10px}dialog{max-width:460px;width:calc(100% - 30px);background:#12263a;color:#eaf5ff;border:1px solid #416578;border-radius:16px;padding:22px;box-shadow:var(--shadow)}dialog::backdrop{background:#020a14bb;backdrop-filter:blur(5px)}dialog h2{font-size:19px;margin-top:0}dialog .action{justify-content:flex-end}.preview-phone .app{max-width:430px;margin:20px auto 80px;border:1px solid #345068;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.preview-phone .topbar{height:58px;padding:0 14px}.preview-phone .brand{font-size:12px}.preview-phone .crumb,.preview-phone .avatar{display:none}.preview-phone .incident{font-size:10px;gap:5px}.preview-phone .workflow{padding:8px}.preview-phone .workflow>span:last-child{display:none}.preview-phone .shell,.preview-phone .stage-shell{padding:20px 13px}.preview-phone .stage-grid,.preview-phone .review-layout,.preview-phone .compare,.preview-phone .command-grid,.preview-phone .evidence-grid{grid-template-columns:1fr}.preview-phone .title{font-size:23px}.preview-phone .title-row{display:block}.preview-phone .stats{grid-template-columns:repeat(2,1fr)}.preview-phone .mobile-wrap{border:0;border-radius:0;box-shadow:none}.preview-phone .observation-list{flex-direction:row;overflow:auto;margin-bottom:5px}.preview-phone .observation-choice{flex:0 0 215px}.preview-phone .observation-list>.notice{display:none}.preview-phone .form-pair{grid-template-columns:1fr;gap:0}.preview-phone .stage-footer,.preview-phone .execute-banner{align-items:stretch;flex-direction:column}.preview-phone .execute-banner button{padding:11px}.preview-phone .stage-footer button{min-height:44px}.preview-phone .dropzone{padding:24px 15px}.preview-phone .view-switch{margin-top:12px}.preview-phone .notice{overflow-wrap:anywhere}.preview-phone .source-line{overflow-wrap:anywhere}.marker{cursor:pointer}.compare-card{font:inherit;color:inherit;cursor:pointer}.workflow button{min-height:36px}
 @media(max-width:600px){.review-layout{grid-template-columns:1fr}.observation-list{flex-direction:row;overflow:auto}.observation-choice{flex:0 0 215px}.observation-list>.notice{display:none}.form-pair{grid-template-columns:1fr}.preview-phone .app{margin:0 auto 70px;border-radius:0;border:0}.design-controls{padding:7px 10px}.topbar .brand{font-size:12px}.execute-banner{align-items:stretch;flex-direction:column}.action button{min-height:44px}.form-label input,.form-label select,.form-label textarea{font-size:16px}.toast{left:14px;right:14px;top:14px}.workflow{scrollbar-width:thin}.dropzone{padding:20px 12px}}
</style>
<dialog id="correction-dialog" aria-labelledby="correction-title"><form onsubmit="saveCorrection(event)"><div class="kicker">HUMAN CORRECTION</div><h2 id="correction-title">确认东侧道路已阻断？</h2><p class="subtitle" style="margin-bottom:18px">此修正会更新现场状态，关联的旧方案将标记为过期。</p><label class="form-label">纠正依据<textarea id="correction-reason" required maxlength="400">现场复核：东侧道路存在散落构件，车辆无法通行。</textarea></label><div class="action"><button type="button" class="ghost" onclick="document.getElementById('correction-dialog').close()">取消</button><button class="primary" type="submit">保存纠正</button></div></form></dialog>
<script>render();</script>
